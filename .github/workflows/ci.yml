name: Verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos do repositório
        run: python3 tools/check_repository.py
      - name: Executar testes básicos
        run: python3 tools/run-tests.py
