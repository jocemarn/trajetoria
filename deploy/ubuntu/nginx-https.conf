server {
    listen 80;
    server_name trajetoria.net.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/trajetoria-acme; }
    location / { return 301 https://trajetoria.net.br$request_uri; }
}
server {
    listen 443 ssl;
    server_name trajetoria.net.br;
    ssl_certificate /etc/letsencrypt/live/trajetoria.net.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trajetoria.net.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/trajetoria/app/public;
    index index.php;
    client_max_body_size 40m;
    access_log /var/log/nginx/trajetoria-access.log;
    error_log /var/log/nginx/trajetoria-error.log;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 130s;
    }
    location ~ /\. { deny all; }
}
