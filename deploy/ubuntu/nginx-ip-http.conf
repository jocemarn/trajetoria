server {
    listen 80;
    server_name trajetoria.net.br 177.93.129.219;
    root /srv/trajetoria/app/public;
    index index.php;
    client_max_body_size 40m;
    access_log /var/log/nginx/trajetoria-access.log;
    error_log /var/log/nginx/trajetoria-error.log;
    location ^~ /.well-known/acme-challenge/ { root /var/www/trajetoria-acme; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 130s;
    }
    location ~ /\. { deny all; }
}
